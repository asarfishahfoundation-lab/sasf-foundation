<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Reset an SASF Foundation administrator password.">
    <title>Reset Password | SASF Foundation</title>
    <link rel="stylesheet" href="/server/admin/login.css">
</head>
<body>
<main class="login-container">
    <section class="login-card">
        <div class="brand">
            <h1>SASF Foundation</h1>
            <p>Administrator Password Recovery</p>
            <div class="gold-line"></div>
        </div>
        <p class="recovery-intro">Verify the security challenge, then use the code sent to your administrator email to choose a new password.</p>

        <section class="recovery-step" id="captchaStep">
            <form id="captchaForm">
                <div class="form-group">
                    <label for="captchaAnswer">Security challenge</label>
                    <div class="captcha-row">
                        <img id="captchaImage" class="captcha-image" alt="CAPTCHA challenge">
                        <button class="captcha-refresh" id="captchaRefresh" type="button" aria-label="Get a new CAPTCHA" title="Get a new CAPTCHA">↻</button>
                    </div>
                    <input id="captchaAnswer" name="captchaAnswer" autocomplete="off" autocapitalize="characters" maxlength="6" required>
                </div>
                <button class="login-button" type="submit" id="captchaButton">Verify CAPTCHA</button>
            </form>
        </section>

        <section class="recovery-step" id="emailStep" hidden>
            <form id="emailForm">
                <div class="form-group">
                    <label for="recoveryEmail">Administrator Gmail address</label>
                    <input type="email" id="recoveryEmail" autocomplete="email" maxlength="254" placeholder="name@gmail.com" required>
                </div>
                <button class="login-button" type="submit" id="emailButton">Send reset code</button>
            </form>
        </section>

        <section class="recovery-step" id="codeStep" hidden>
            <form id="codeForm">
                <div class="form-group">
                    <label for="recoveryCode">Six-digit code</label>
                    <input type="text" id="recoveryCode" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" placeholder="000000" required>
                </div>
                <button class="login-button" type="submit" id="codeButton">Verify code</button>
            </form>
        </section>

        <section class="recovery-step" id="passwordStep" hidden>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="newPassword">New password</label>
                    <div class="password-wrapper">
                        <input type="password" id="newPassword" autocomplete="new-password" minlength="12" maxlength="200" required>
                        <button type="button" class="password-toggle" id="newPasswordToggle" aria-label="Show new password" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <div class="password-wrapper">
                        <input type="password" id="confirmPassword" autocomplete="new-password" minlength="12" maxlength="200" required>
                        <button type="button" class="password-toggle" id="confirmPasswordToggle" aria-label="Show confirmation password" title="Show password">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6z"></path>
                                <circle cx="12" cy="12" r="2.5"></circle>
                            </svg>
                        </button>
                    </div>
                </div>
                <button class="login-button" type="submit" id="passwordButton">Update password</button>
            </form>
        </section>

        <div id="message" class="message" role="status" aria-live="polite"></div>
        <a class="text-link" href="/admin/login">Back to administrator login</a>
    </section>
    <div class="footer">SASF Foundation · Secure Administration</div>
</main>
<script src="/admin/forgot-password.js" defer></script>
<script src="/brand.js" defer></script>
</body>
</html>
